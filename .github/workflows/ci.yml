# Pushes to main and pull requests run the checks: no host's name (scripts/check-names.sh), build, the unit tests, the
# Docker provider's and the cloud protocol's tests against the runner's Docker engine, and pack, with the names checked
# inside the packages too. A v<version> tag runs them, then pushes the packages to nuget.org through
# Trusted Publishing (a one-hour key nuget.org gives this workflow, no stored secret) and makes a GitHub release
# (see README.md, "Releasing"). Each action is pinned by commit SHA, its version in a comment; Dependabot keeps them
# current (.github/dependabot.yml).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      ABP_SANDBOX_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: bash scripts/check-release.sh
      - run: bash scripts/check-names.sh
      - run: dotnet build AbpSandbox.slnx -c Release
      - run: dotnet test AbpSandbox.slnx -c Release --no-build
      - run: dotnet pack AbpSandbox.slnx -c Release --no-build -o artifacts
      - run: bash scripts/check-names.sh --packages artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The nuget.org Trusted Publishing policy names this repository, ci.yml and this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/
      - run: bash scripts/check-release.sh --tag "$GITHUB_REF_NAME" --unpublished
      - name: nuget.org key for this run
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for $GITHUB_REF_NAME." --verify-tag
